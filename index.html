<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELEX - Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding-bottom: 70px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121824;
            border-bottom: 1px solid #1f293d;
        }
        header h1 {
            color: #00f2fe;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #121824;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .saldo-title {
            font-size: 12px;
            color: #8b9bb4;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .saldo-value {
            font-size: 32px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 5px;
        }
        .progresso-text {
            font-size: 12px;
            color: #8b9bb4;
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0e14;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        /* Estilos do Chat interno */
        .chat-box {
            background-color: #121824;
            border: 1px solid #1f293d;
            border-radius: 16px;
            height: 350px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            gap: 10px;
            text-align: left;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 14px;
        }
        .message.bot {
            background-color: #1f293d;
            color: #fff;
            align-self: flex-start;
        }
        .message.user {
            background-color: #00f2fe;
            color: #0b0e14;
            align-self: flex-end;
            font-weight: 500;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #121824;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
        }
        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #121824;
            border-top: 1px solid #1f293d;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            text-decoration: none;
            font-size: 11px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-item.active {
            color: #00f2fe;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 3px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <h1>ELEX</h1>
        <span style="color: #4facfe; font-size: 14px;">Painel Web</span>
    </header>

    <div class="container">
        <!-- ABA HOME -->
        <div id="tab-home" class="tab-content active">
            <div class="card">
                <div class="saldo-title">SALDO ACUMULADO</div>
                <div class="saldo-value" id="saldoDisplay">R$ 0,00</div>
                <div class="progresso-text">Progresso no Ciclo: <span id="progressoDisplay">0</span>/30</div>
                <button class="btn" onclick="assistirAnuncio(1)">⚡ Anúncio Rápido [+0.05]</button>
            </div>
        </div>

        <!-- ABA CHAT (BOT NO SITE) -->
        <div id="tab-chat" class="tab-content">
            <div class="chat-box" id="chatMessages">
                <div class="message bot">Olá! Eu sou o assistente virtual da ELEX. Como posso ajudar hoje?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escreva uma mensagem...">
                <button class="btn" style="width: auto; margin-top: 0; padding: 0 20px;" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Barra de Navegação Inferior -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="mudarTab('home', event)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-item" onclick="mudarTab('chat', event)">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Chat / Bot
        </button>
    </nav>

    <script>
        const userId = 'utilizador_web_1';

        async function carregarDados() {
            try {
                const res = await fetch(`/api/user?userId=${userId}`);
                const data = await res.json();
                document.getElementById('saldoDisplay').innerText = `R$ ${(data.saldo || 0).toFixed(2)}`;
                document.getElementById('progressoDisplay').innerText = data.progressoCiclo || 0;
            } catch (err) {
                console.error('Erro ao carregar dados:', err);
            }
        }

        async function assistirAnuncio(qtd) {
            try {
                const res = await fetch('/api/assistir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, progressoInc: qtd })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('saldoDisplay').innerText = `R$ ${(data.saldo || 0).toFixed(2)}`;
                    document.getElementById('progressoDisplay').innerText = data.progressoCiclo;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Erro ao processar.');
            }
        }

        function mudarTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function enviarMensagem() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            const chatBox = document.getElementById('chatMessages');

            // Mensagem do utilizador
            const msgUser = document.createElement('div');
            msgUser.className = 'message user';
            msgUser.innerText = texto;
            chatBox.appendChild(msgUser);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Resposta automática do bot no site
            setTimeout(() => {
                const msgBot = document.createElement('div');
                msgBot.className = 'message bot';
                msgBot.innerText = 'Recebi a sua mensagem: "' + texto + '". Em breve teremos respostas automáticas aqui!';
                chatBox.appendChild(msgBot);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        carregarDados();
    </script>
</body>
</html>
