<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELEX - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding-bottom: 70px; /* Espaço para a barra de navegação inferior */
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121824;
            border-bottom: 1px solid #1f293d;
        }
        header h1 {
            color: #00f2fe;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .username {
            color: #4facfe;
            font-size: 14px;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #121824;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .saldo-title {
            font-size: 12px;
            color: #8b9bb4;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .saldo-value {
            font-size: 32px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 5px;
        }
        .progresso-text {
            font-size: 12px;
            color: #8b9bb4;
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0e14;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-top: 10px;
        }
        .input-group label {
            font-size: 13px;
            color: #8b9bb4;
        }
        .input-group input {
            background-color: #0b0e14;
            border: 1px solid #1f293d;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
        }
        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #121824;
            border-top: 1px solid #1f293d;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            text-decoration: none;
            font-size: 11px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-item.active {
            color: #00f2fe;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 3px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <h1>ELEX</h1>
        <span class="username" id="userHandle">@Utilizador</span>
    </header>

    <div class="container">
        <!-- Cartão Principal de Saldo -->
        <div class="card">
            <div class="saldo-title">SALDO ACUMULADO</div>
            <div class="saldo-value" id="saldoDisplay">R$ 0,00</div>
            <div class="progresso-text">Progresso no Ciclo: <span id="progressoDisplay">0</span>/30</div>
            
            <button class="btn" onclick="assistirAnuncio(1)">⚡ Anúncio Rápido (5s) [+0.05]</button>
        </div>

        <!-- Secção PIX -->
        <div class="card">
            <div class="input-group">
                <label>Solicitar Levantamento PIX</label>
                <input type="text" id="chavePix" placeholder="Chave PIX (CPF, Email, Telefone)">
            </div>
            <button class="btn" onclick="solicitarPix()">Solicitar Levantamento (Mín. R$ 0,50)</button>
        </div>
    </div>

    <!-- Barra de Navegação Inferior Fixa -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="mudarTab('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-item" onclick="mudarTab('ads')">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Ads
        </button>
        <button class="nav-item" onclick="mudarTab('chat')">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Chat
        </button>
        <button class="nav-item" onclick="mudarTab('search')">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Search
        </button>
        <button class="nav-item" onclick="mudarTab('profile')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const chatId = tg.initDataUnsafe?.user?.id || 123456789; // ID de teste se aberto no browser
        const username = tg.initDataUnsafe?.user?.username || 'Utilizador';
        
        document.getElementById('userHandle').innerText = '@' + username;

        // Carregar dados do utilizador
        async function carregarDados() {
            try {
                const res = await fetch(`/api/user?chatId=${chatId}`);
                const data = await res.json();
                document.getElementById('saldoDisplay').innerText = `R$ ${(data.saldo || 0).toFixed(2)}`;
                document.getElementById('progressoDisplay').innerText = data.progressoCiclo || 0;
            } catch (err) {
                console.error('Erro ao carregar dados:', err);
            }
        }

        async function assistirAnuncio(qtd) {
            try {
                const res = await fetch('/api/assistir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId, progressoInc: qtd })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('saldoDisplay').innerText = `R$ ${(data.saldo || 0).toFixed(2)}`;
                    document.getElementById('progressoDisplay').innerText = data.progressoCiclo;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Erro ao processar anúncio.');
            }
        }

        function solicitarPix() {
            const chave = document.getElementById('chavePix').value;
            if (!chave) {
                alert('Por favor, insira a sua chave PIX.');
                return;
            }
            alert('Pedido de levantamento enviado com sucesso!');
        }

        function mudarTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        carregarDados();
    </script>
</body>
</html>
